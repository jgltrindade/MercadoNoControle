<mat-sidenav-container class="shell">
  <mat-sidenav
    class="shell__sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    [attr.role]="isHandset() ? 'dialog' : 'navigation'"
  >
    <a class="shell__brand" routerLink="/dashboard" (click)="closeOnHandset()">
      <mat-icon class="shell__brand-icon">shopping_cart_checkout</mat-icon>
      <span>{{ appName }}</span>
    </a>

    <mat-nav-list aria-label="Menu principal">
      @for (item of navigationItems; track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive
          #link="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          [activated]="link.isActive"
          [attr.aria-current]="link.isActive ? 'page' : null"
          (click)="closeOnHandset()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="shell__body">
    <mat-toolbar class="shell__header">
      @if (isHandset()) {
        <button mat-icon-button type="button" aria-label="Abrir menu" (click)="sidenav().toggle()">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <h1 class="shell__title">{{ pageTitle() }}</h1>
      <span class="shell__spacer"></span>
      <app-api-status />
    </mat-toolbar>

    <main class="shell__content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
